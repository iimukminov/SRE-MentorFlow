apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentorflow-app
  namespace: mentorflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mentorflow
  template:
    metadata:
      labels:
        app: mentorflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-migrations
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-service -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1 FROM flyway_schema_history WHERE success = true LIMIT 1;" >/dev/null 2>&1; do
                echo "Waiting for Flyway migration job to complete..."
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: mentorflow-config
            - secretRef:
                name: mentorflow-secret
      containers:
        - name: app
          image: mentorflow-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: mentorflow-config
            - secretRef:
                name: mentorflow-secret
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mentorflow-service
  namespace: mentorflow
spec:
  type: NodePort
  selector:
    app: mentorflow
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mentorflow-app-hpa
  namespace: mentorflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mentorflow-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70