apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentorflow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mentorflow
  template:
    metadata:
      labels:
        app: mentorflow
    spec:
      containers:
        - name: app
          image: mentorflow-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mentorflow-config
            - secretRef:
                name: mentorflow-secret
---
apiVersion: v1
kind: Service
metadata:
  name: mentorflow-service
spec:
  type: NodePort
  selector:
    app: mentorflow
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080