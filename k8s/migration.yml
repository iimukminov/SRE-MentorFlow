apiVersion: batch/v1
kind: Job
metadata:
  name: mentorflow-migration
  namespace: mentorflow
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mentorflow-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: mentorflow-config
            - secretRef:
                name: mentorflow-secret
      containers:
        - name: flyway-migration
          image: mentorflow-app:v1
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: mentorflow-config
            - secretRef:
                name: mentorflow-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"