spring:
  application:
    name: sre-mentorflow

  session:
    store-type: ${SESSION_STORE_TYPE:redis}

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    cache: ${FREEMARKER_CACHE:false}
    charset: UTF-8

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${DB_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${DB_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  redis:
    cache:
      ttl-minutes: ${CACHE_TTL_MINUTES:1m}
  github:
    client:
      connect-timeout: ${GITHUB_CONNECT_TIMEOUT:10s}
      read-timeout: ${GITHUB_READ_TIMEOUT:10s}
      sync-interval: ${GITHUB_SYNC_INTERVAL:10m}
      token: ${GITHUB_TOKEN}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health